# 依赖的构建脚本：一律不执行。
#
# pnpm 10 起这已经是默认行为——本仓实测，`pnpm install` 会打印
# `Ignored build scripts: esbuild@0.27.7, sharp@0.34.5`。这里把它写成一份
# **显式的空白名单**，图的不是改变行为，是让「谁可以跑脚本」从一个可能随版本
# 变的默认值，变成一份可清点、进 diff、有人看得见的清单。将来某个依赖真需要
# postinstall，得往这里加一行——那一行会出现在评审里。
#
# ⚠ 这不是「用它取代 --ignore-scripts」。CI 的 action 里两道都开着（见
# .github/actions/setup-node-pnpm/action.yml）。分工是：
#
#   · 这份名单对**所有安装**生效，含开发者本机，而且它是可清点的——将来某个
#     依赖真需要 postinstall，得往里加一行，那一行会出现在评审里
#   · action 里的 --ignore-scripts 只管 CI，是纵深的第二道
#
# 初次处置（2026-08-26 早些时候）曾判定不加 --ignore-scripts，理由是「它会连
# 本仓自己的 prepare 一起关掉」。**那句把成本说重了**：这个 action 只在 CI 用，
# 而全仓唯一的钩子是 `prepare: husky || true`（装 git 钩子），CI 不用 git 钩子。
# 清装实测后改成两道都上。
#
# 判据见 docs/070-audit-playbook.md §5.2 与 docs/audit/known-false-positives.md。
#
# 这份名单**确实生效**，不是摆设——2026-08-26 实证：把 esbuild 临时加进来再装一
# 次，它的 postinstall 当场跑了（`esbuild postinstall$ node install.js`）；拿掉
# 就不跑。注意 pnpm 仍会打印一行 `Ignored build scripts: …` 告知跳过了谁，
# **那不是字段没被读取**，只是它在报告结果。
onlyBuiltDependencies: []
