# SonarQube Cloud —— 自动分析（Automatic Analysis）配置。
#
# ── 为什么是这个文件名 ──
# 本仓没有 CI 扫描器：`.github/workflows/` 里没有任何 sonar 步骤，PR 上那个
# "SonarCloud Code Analysis" 检查来自 SonarCloud 的 GitHub App，即自动分析。
#
# 自动分析**只读 `.sonarcloud.properties`**。仓根若放 `sonar-project.properties`
# （CI 扫描器的配置文件名），自动分析会把它的参数**整份忽略**——文件躺在仓里
# 像模像样，一个字都不生效，而且没有任何报错提示这件事。参考仓
# vxturestudio/vxture-atlas 用的是 `sonar-project.properties`，因为它另有
# `.github/workflows/sonar.yml` 在跑 sonarqube-scan-action，是另一种接法；
# 照抄那份文件名到本仓等于写了个装饰品。
#
# ── 为什么没有 projectKey / organization / host.url / projectName ──
# 那四项在 GitHub 导入时就已绑定，自动分析不接受在此覆盖。现值（2026-08-25 经
# api/components/show 核对，非推测）：
#   organization = vx-6b309295f6500aba6b2a71a29ee27de77fa41583
#   projectKey   = vxture_vxture-design      ← 导入时冻结，改名只改显示名
#   visibility   = public                     ← 公共行数不计入 Free 版私有 LOC
#                                               配额，故 atlas/platform 卡住的
#                                               那个 org 级配额问题在本仓不存在
# SonarLint 侧的绑定在 `.vscode/settings.json`，connectionId 与上面的 org key
# 是同一串；两处要一起改，改一处会让编辑器内提示与云端规则集悄悄分叉。

# 扫全仓,靠 exclusions 做减法,**不要用 sonar.sources 做加法**。
#
# 这条是踩出来的:初版写 `sonar.sources=packages,scripts`,`.github/` 随之离开
# 扫描范围,SonarCloud 把那里一条真实的供应链发现(setup-node-pnpm/action.yml:
# 「Omitting --ignore-scripts allows lifecycle scripts to run during package
# install」)直接标成 **FIXED** 关掉了——没人修过它,只是没人再看它。仪表盘数字
# 变好看、问题原样留在仓里,比不配置更糟。
#
# 白名单式的 sources 每加一个新顶层目录都要有人回来补一笔,漏补没有任何反馈;
# 黑名单式的 exclusions 漏补只是多扫一点噪声。两种错的代价不对称,故取后者。
# 扫描范围因此含 .github/(工作流与复合 action 有自己的规则集)与仓根配置。
sonar.sources=.

# 无 sonar.tests：本仓零测试文件、零覆盖率产物。指向不存在的路径会让分析报错，
# 空着比填一个假路径诚实。将来加了测试再一并补 tests 与 lcov 上报。

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  docs/artifacts/**,\
  packages/design-system/src/generated-reexports.ts,\
  packages/design-tokens/src/generated/**,\
  packages/design-tokens/src/styles/primitive/**,\
  packages/design-tokens/src/styles/semantic/**,\
  packages/design-tokens/src/styles/theme.css

# 上面五条生成物排除项的共同判据：**它们由脚本写出、且提交进仓**（token 生成物
# 入仓是有意的，见 .gitignore 里那条注释——CI 没有任何步骤会重新生成它们，
# `--check` 模式只守它与策略源同步）。对生成物报 code smell 是无处可改的噪声：
# 唯一的改法是改生成器，而生成器本身在 scripts/ 里，已经在扫描范围内。

# 复制粘贴检测（CPD）排除:图标字典是一张**平表**——14 个 `{ label, icons: [...] }`
# 结构相同、内容不同,CPD 匹配的是这个 token 序列,判成重复。
#
# 这里不该去重:给一张数据表发明抽象只会让它更难读,而这份表的价值恰恰在于一眼能
# 看全。CPD 排除只关掉「重复」这一项,该文件的其余规则照查。
#
# 触发点:2026-08-25 把 14 个分组名从中文改英文,那 14 行成了「新增行」,落进本来
# 就存在的重复块里,PR 的 new_duplicated_lines_density 冲到 92.9%。重复本来就在,
# 只是从没被算作新增过。
# docs/artifacts/ 是**文档底本**,不是应用代码:
#   · 四份文档共用同一套版式与配色——那是这个格式的定义,不是重复
#     (「一个每换产品就换配色的文档系统,是三个产品,不是一个系统」)
#   · _reference-karda-audit.html 是另一份已发布页面的**逐字节副本**,入仓只为
#     给 check-doc-shape 对账。去"修"它就等于让参照物不再是参照物
#   · 它们是页面片段(由宿主包 doctype/html/head),按整页规则扫必然报缺 doctype
# ⚠ 这一条曾经在本文件里写了**两遍**：上面那份多行的，和这里一份单行的。properties
# 的后者整份盖掉前者——改上面那份不会有任何效果，而且没有任何报错提示这
# 件事。已合并成上面一处，docs/artifacts/** 也并了进去。

# 第二张平表，判据与图标字典完全相同：`NAMESPACES` 是二十来个
# `{ ns, file, title, utility }` —— 结构相同、内容不同，CPD 匹配的是这个 token
# 序列。给一张数据表发明抽象只会让它更难读，而这份表的价值恰恰在于一眼看全。
#
# 触发点：2026-08-27 把 `.mjs` 纳入 format:check 后跑了一次 `--write`，每个条目
# 从一行展成六行，那些行成了「新增行」，落进本来就存在的重复块里（#39）。
# **重复本来就在，只是从没被算作新增过** —— 与图标字典那次是同一个形状。
#
# 同一个 PR 报出来的另外两处重复**没有**进这张表，因为它们是真该去掉的：三份
# 逐字节相同的 eslint.config.mjs，与两个守卫各手抄一遍的 tailwind 解析逻辑。
# 前者并成 eslint.config.package.mjs，后者抽成 lib/load-tailwind.mjs。
# 排除项只该用在「不该去重」的地方，不该用来消化「懒得去重」。
sonar.cpd.exclusions=\
  packages/design-ui/src/icons/iconDictionary.ts,\
  scripts/design-tokens/tailwind-baseline.mjs

sonar.sourceEncoding=UTF-8
