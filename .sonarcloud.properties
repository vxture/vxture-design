# SonarQube Cloud —— 自动分析（Automatic Analysis）配置。
#
# ── 为什么是这个文件名 ──
# 本仓没有 CI 扫描器：`.github/workflows/` 里没有任何 sonar 步骤，PR 上那个
# "SonarCloud Code Analysis" 检查来自 SonarCloud 的 GitHub App，即自动分析。
#
# 自动分析**只读 `.sonarcloud.properties`**。仓根若放 `sonar-project.properties`
# （CI 扫描器的配置文件名），自动分析会把它的参数**整份忽略**——文件躺在仓里
# 像模像样，一个字都不生效，而且没有任何报错提示这件事。参考仓
# vxturestudio/vxture-atlas 用的是 `sonar-project.properties`，因为它另有
# `.github/workflows/sonar.yml` 在跑 sonarqube-scan-action，是另一种接法；
# 照抄那份文件名到本仓等于写了个装饰品。
#
# ── 为什么没有 projectKey / organization / host.url / projectName ──
# 那四项在 GitHub 导入时就已绑定，自动分析不接受在此覆盖。现值（2026-08-25 经
# api/components/show 核对，非推测）：
#   organization = vx-6b309295f6500aba6b2a71a29ee27de77fa41583
#   projectKey   = vxture_vxture-design      ← 导入时冻结，改名只改显示名
#   visibility   = public                     ← 公共行数不计入 Free 版私有 LOC
#                                               配额，故 atlas/platform 卡住的
#                                               那个 org 级配额问题在本仓不存在
# SonarLint 侧的绑定在 `.vscode/settings.json`，connectionId 与上面的 org key
# 是同一串；两处要一起改，改一处会让编辑器内提示与云端规则集悄悄分叉。

# 三个发布包 + 预览面 + 守卫与生成脚本。scripts/ 不排除：guardrail 与 token
# 生成器是本仓真正长期演进的逻辑，不是配置。
sonar.sources=packages,scripts

# 无 sonar.tests：本仓零测试文件、零覆盖率产物。指向不存在的路径会让分析报错，
# 空着比填一个假路径诚实。将来加了测试再一并补 tests 与 lcov 上报。

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  packages/design-system/src/generated-reexports.ts,\
  packages/design-tokens/src/generated/**,\
  packages/design-tokens/src/styles/primitive/**,\
  packages/design-tokens/src/styles/semantic/**,\
  packages/design-tokens/src/styles/theme.css

# 上面五条生成物排除项的共同判据：**它们由脚本写出、且提交进仓**（token 生成物
# 入仓是有意的，见 .gitignore 里那条注释——CI 没有任何步骤会重新生成它们，
# `--check` 模式只守它与策略源同步）。对生成物报 code smell 是无处可改的噪声：
# 唯一的改法是改生成器，而生成器本身在 scripts/ 里，已经在扫描范围内。

sonar.sourceEncoding=UTF-8
