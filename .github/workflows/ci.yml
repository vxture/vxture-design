# ci.yml — vxture-design 的 PR 与 main 门禁。
#
# 顺序是硬约束：伞包的类型引用的是 design-ui / design-tokens 的**产物**（.d.ts），
# 不是它们的源码，而 type-check 自己不产出声明。不先按依赖方向构建就必然 TS2307，
# 且这个失败只在干净检出上出现——本地留着上一次的 dist，看起来一直是绿的。

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.ref_name) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-pnpm

      - name: Build design packages (tokens → ui → system)
        run: pnpm build

      # 紧跟 build：断言 /server 产物真的在，且在 react-server 下可求值。
      # 默认档（guardrails 链条里那次）产物缺失只是 skip + EXIT=0——本地还没
      # build 时不拦人是对的，但 CI 里"没东西可验"本身就是故障。这一步用
      # --require-artifacts 把它变成红灯，且放在这里能直接归因到 build。
      - name: Server entry safety (artifacts required)
        run: pnpm lint:server-entry:strict

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # 十一道守卫（数量随 package.json 的 guardrails 链条走，别在这里手抄）。
      # lint:design 会跳过本仓不存在的扫描根（portals/business）——
      # 那部分管辖消费方怎么用 DS，不在本仓职责内。
      - name: Design guardrails
        run: pnpm guardrails

      # 守卫自测：给每条守卫一份已知有病的输入，断言它非零退出。
      # 放在 guardrails **之后**：那一条证明当前代码干净，这一条证明
      # 上一条的「干净」不是因为检查已经死了。要求干净工作树，CI 天然满足。
      # --require-artifacts：任何用例被跳过都判失败。CI 在 build 之后跑，
      # 「没东西可测」本身就是故障——一个测不到东西的自测报绿最没意义。
      - name: Guardrail self-test (mutation)
        run: pnpm test:guardrails:strict

      # 组件行为测试。守卫自测证明仪器活着，这一条测的是件本身跑起来对不对
      # ——两者补的不是同一个洞。
      #
      # **递归跑，不要在这里点名某个包。** 这一步曾写死
      # `--filter @vxture/design-ui`，于是伞包的 321 条用例在 CI 里一次都没跑过
      # ——而伞包正是应用唯一直接安装的包。这与当时快照脚本「只读 design-ui 的
      # 覆盖产物」是同一个形状：**清单按「我记得谁有测试」排，新增的那个不会有人
      # 回来补**。`--if-present` 让没有 test 脚本的包自动跳过，所以哪个包哪天加了
      # 用例，这里不必再改。
      #
      # 带覆盖率跑：不设阈值门槛（阈值会催生「为过线而写的测试」），
      # 只为把「哪些代码从没被执行过」这个数留在 CI 日志里。
      - name: Component tests (with coverage)
        run: pnpm --recursive --if-present test:coverage

  preview-build:
    name: preview-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-pnpm

      # 预览面是 DS 唯一的真实渲染消费方：组件改坏了，这里先炸。
      - name: Build design packages
        run: pnpm build

      - name: Build preview surface
        run: pnpm build:preview
